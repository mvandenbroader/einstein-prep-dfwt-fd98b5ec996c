<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Direct Meeting Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Tokens mirror Einstein Meeting OS (meeting-intake.html) so this page reads as the same product. */
:root {
  --navy: #27343D; --navy-50: #EEF1F4; --navy-200: #9AADB7;
  --blue: #0979C3; --blue-700: #065E9A; --blue-50: #EBF4FB;
  --orange: #EF8B22; --grey-50: #F4F5F5; --grey-100: #E2E3E4; --grey-400: #787C7F; --grey-500: #53575A;
  --card: #FFFFFF; --bg: #F4F5F5; --text: #53575A; --heading: #27343D; --muted: #787C7F; --line: #E2E3E4;
  --field-border: #9AADB7; --field-bg: #FFFFFF; --goal-head: #EEF1F4;
  --error: #CC0100; --error-bg: #FBE7E6; --ok: #1F7A3D; --ok-bg: #E7F3EA;
  --sg: #1F7A3D; --sg-bg: #E7F3EA; --g: #4C8C41; --g-bg: #EEF5EC; --y: #A87B00; --y-bg: #FBF1D9;
  --r: #CC0100; --r-bg: #FBE7E6; --u: #6B6F72; --u-bg: #EDEDEE;
  --shadow: 0 1px 2px rgba(39,52,61,0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --card: #1E262C; --bg: #151B1F; --text: #C9D1D6; --heading: #EEF1F4; --muted: #93A0A8; --line: #2F3A42;
    --field-border: #4A5963; --field-bg: #151B1F; --goal-head: #25303700; --navy-50: #25303A; --blue-50: #13293A;
    --sg-bg: #16301F; --g-bg: #1C2E1A; --y-bg: #33290F; --r-bg: #3A1716; --u-bg: #2A2F33; --error-bg: #3A1716; --ok-bg: #16301F;
    --sg: #6FCF8E; --g: #8FC482; --y: #E2B64A; --r: #FF7B73; --u: #A9AFB3; --error: #FF7B73; --ok: #6FCF8E;
  }
}
:root[data-theme="dark"] {
  --card: #1E262C; --bg: #151B1F; --text: #C9D1D6; --heading: #EEF1F4; --muted: #93A0A8; --line: #2F3A42;
  --field-border: #4A5963; --field-bg: #151B1F; --navy-50: #25303A; --blue-50: #13293A;
  --sg-bg: #16301F; --g-bg: #1C2E1A; --y-bg: #33290F; --r-bg: #3A1716; --u-bg: #2A2F33; --error-bg: #3A1716; --ok-bg: #16301F;
  --sg: #6FCF8E; --g: #8FC482; --y: #E2B64A; --r: #FF7B73; --u: #A9AFB3; --error: #FF7B73; --ok: #6FCF8E;
}
body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg);
  color: var(--text); font-size: 16px; line-height: 1.5; }
.top { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex;
  align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; color: var(--heading); }
.brand span { color: var(--orange); }
.tabs { display: flex; gap: 6px; }
.tab { border: 1px solid var(--field-border); background: var(--card); color: var(--heading); border-radius: 999px;
  padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
.tab.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
.banner { border-radius: 6px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
.banner.warn { background: var(--y-bg); color: var(--y); }
.banner.err { background: var(--error-bg); color: var(--error); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--orange); }
h1 { color: var(--heading); font-size: 1.6rem; line-height: 1.2; margin: 6px 0 8px; }
h2 { color: var(--heading); font-size: 1.3rem; margin: 0 0 4px; }
h3 { color: var(--heading); font-size: 1.05rem; margin: 0 0 4px; }
.lede { margin-bottom: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
.hint { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.req { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
label.q { display: block; font-weight: 700; color: var(--heading); margin: 16px 0 2px; }
select, input[type=date], input[type=number], input[type=text], textarea {
  width: 100%; font: inherit; color: var(--heading); background: var(--field-bg); border: 1px solid var(--field-border);
  border-radius: 6px; padding: 9px 11px; }
textarea { min-height: 88px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
.bad { border-color: var(--error) !important; }
.errtxt { color: var(--error); font-size: 13px; margin-top: 4px; }
.btn { background: var(--blue); color: #fff; border: 1px solid transparent; border-radius: 6px; padding: 11px 18px;
  font: inherit; font-weight: 500; cursor: pointer; }
.btn:hover { background: var(--blue-700); }
.btn.ghost { background: transparent; color: var(--blue); border-color: var(--blue); }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.toc { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin: 12px 0 4px; font-size: 14px; }
.toc a { color: var(--blue); text-decoration: none; }
.toc b { color: var(--blue); margin-right: 6px; }
.section { margin-top: 30px; scroll-margin-top: 12px; }
.sec-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.goal { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 18px; background: var(--card); }
.goal-head { background: var(--navy-50); padding: 16px 18px; }
.goal-body { padding: 4px 18px 18px; }
.goal-tag { font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
.tgt-l { font-size: 12px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--heading); margin-top: 10px; }
details { margin-top: 10px; font-size: 14px; }
summary { cursor: pointer; font-weight: 500; color: var(--heading); }
.src { font-size: 13px; color: var(--muted); margin-top: 10px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.s-super_green { background: var(--sg-bg); color: var(--sg); }
.s-green { background: var(--g-bg); color: var(--g); }
.s-yellow, .s-at_risk { background: var(--y-bg); color: var(--y); }
.s-red { background: var(--r-bg); color: var(--r); }
.s-unknown, .s-blocked, .s-no_data, .s-not_started { background: var(--u-bg); color: var(--u); }
.check { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }
.check input { margin-top: 5px; width: 18px; height: 18px; }
.radio { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
.radio label { display: flex; gap: 6px; align-items: center; font-size: 15px; }
.park { display: flex; gap: 8px; margin-top: 8px; }
.park input { flex: 1; }
.x { background: transparent; border: 1px solid var(--field-border); color: var(--muted); border-radius: 6px; padding: 0 12px; cursor: pointer; font: inherit; }
.rv-person { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.rv-person:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.rv-goal { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--line); background: var(--bg); border-radius: 0 6px 6px 0; font-size: 14px; }
.rv-goal p { margin-top: 4px; }
.rv-goal b { color: var(--heading); }
.flag { color: var(--y); font-weight: 700; font-size: 13px; }
.muted { color: var(--muted); }
.spin { padding: 40px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="top">
  <div class="brand">EINSTEIN <span>/</span> Meeting preparation</div>
  <div class="tabs" id="tabs"></div>
</div>
<main class="wrap" id="root"><div class="spin">Loading your goals...</div></main>
<script>
// ---------------------------------------------------------------------------
// DIRECT MEETING PREP -- Meeting OS mirror for the non-BM managers (OM / FM).
//
// Same six sections as Einstein Meeting OS meeting-intake.html. The direct
// preps, Mike reviews it with their BM in the BM's 1:1 (BM in the room).
// Built 2026-09-28 as a bridge until Meeting OS supports BM-facilitated 1:1s.
//
// No server. Goals come from data/direct-goals.json (a whitelisted subset of
// qg-data.json, rebuilt by build-direct-prep.py). Submissions commit to
// data/direct-prep.json via the GitHub Contents API with the same #k= write key
// as the weekly sync prep page. PUBLIC REPO: everything submitted here is
// readable by anyone with the repo name. Mike accepted that on 2026-09-28.
// ---------------------------------------------------------------------------

var REPO = 'mvandenbroader/einstein-prep-dfwt-fd98b5ec996c';
var STORE_NS = 'dfwt';
var PREP_PATH = 'data/direct-prep.json';
var API_BASE = 'https://api.github.com/repos/' + REPO + '/contents/';
var RAW_BASE = 'https://raw.githubusercontent.com/' + REPO + '/main/';
var LOCAL_MODE = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);

var COLORS = [
  ['super_green', 'Super Green'], ['green', 'Green'], ['yellow', 'Yellow'], ['red', 'Red'], ['unknown', 'Unknown']
];
var COLOR_LABEL = { super_green: 'Super Green', green: 'Green', yellow: 'Yellow', at_risk: 'At Risk', red: 'Red',
  unknown: 'Unknown', blocked: 'Blocked', no_data: 'No Data', not_started: 'Not Started' };
var CONFIDENCE = ['1 · Very doubtful', '2 · Doubtful', '3 · Unsure', '4 · Confident', '5 · Very confident'];
var HAPPY = ['1 · Very difficult', '2 · Difficult', '3 · Mixed', '4 · Good', '5 · Great'];
var MIN_CHARS = 2;   // "None" is a valid answer

var DATA = null;     // data/direct-goals.json
var PREP = [];       // submissions
var TOKEN = '';
var VIEW = 'prep';   // 'prep' | 'review'
var WHO = null;      // selected direct
var DATE = '';       // meeting date YYYY-MM-DD
var DRAFT = null;
var SHOW_ERRORS = false;
var BUSY = false;
var MSG = null;
var REVIEW_BRANCH = '';

// ---------- storage + token --------------------------------------------------

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function resolveToken() {
  var m = location.hash.match(/[#&]k=([^&]+)/);
  if (m) { TOKEN = decodeURIComponent(m[1]); lsSet('prep_key_' + STORE_NS, TOKEN); return; }
  TOKEN = lsGet('prep_key_' + STORE_NS) || '';
}

// ---------- github io ---------------------------------------------------------

function b64ToUtf8(b64) {
  var bin = atob(String(b64).replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); }));
}
function utf8ToB64(str) {
  var bin = '';
  new TextEncoder().encode(str).forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin);
}
function ghHeaders() {
  var h = { 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return h;
}
function readFile(path) {
  if (LOCAL_MODE) {
    return fetch(path + '?t=' + Date.now(), { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' reading ' + path);
      return res.text();
    }).then(function (t) { return { text: t, sha: null }; });
  }
  if (TOKEN) {
    return fetch(API_BASE + path, { headers: ghHeaders(), cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('GitHub API ' + res.status + ' reading ' + path);
      return res.json();
    }).then(function (b) { return { text: b64ToUtf8(b.content), sha: b.sha }; });
  }
  return fetch(RAW_BASE + path + '?t=' + Date.now(), { cache: 'no-store' }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status + ' reading ' + path);
    return res.text();
  }).then(function (t) { return { text: t, sha: null }; });
}

// Re-read the latest store, replace this person + meeting date, PUT it back.
// Retries on sha conflict when two people submit at once.
function savePrep(entry) {
  var attempt = 0;
  function tryOnce() {
    attempt++;
    return readFile(PREP_PATH).then(function (latest) {
      var store = JSON.parse(latest.text);
      var list = (store.submissions || []).filter(function (s) {
        return !(s.personId === entry.personId && s.meetingDate === entry.meetingDate);
      });
      list.push(entry);
      list.sort(function (a, b) {
        return a.meetingDate === b.meetingDate ? a.personId.localeCompare(b.personId)
                                               : a.meetingDate.localeCompare(b.meetingDate);
      });
      store.submissions = list;
      return fetch(API_BASE + PREP_PATH, {
        method: 'PUT', headers: ghHeaders(),
        body: JSON.stringify({
          message: 'Direct prep: ' + entry.personName + ' - ' + entry.meetingDate,
          content: utf8ToB64(JSON.stringify(store, null, 2) + '\n'),
          sha: latest.sha
        })
      }).then(function (res) {
        if (res.ok) { PREP = list; return; }
        if ((res.status === 409 || res.status === 422) && attempt < 4) return tryOnce();
        if (res.status === 401 || res.status === 403) throw new Error('Your link key was not accepted. Ask Mike for a fresh link.');
        throw new Error('GitHub API ' + res.status + ' -- preparation not saved.');
      });
    });
  }
  return tryOnce();
}

// ---------- helpers -----------------------------------------------------------

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function filled(s) { return String(s == null ? '' : s).trim().length >= MIN_CHARS; }
function todayIso() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function pill(status) {
  return '<span class="pill s-' + esc(status || 'unknown') + '">' + esc(COLOR_LABEL[status] || status || 'Unknown') + '</span>';
}
function personById(id) {
  var list = (DATA && DATA.directs) || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}
function submissionFor(personId, date) {
  for (var i = 0; i < PREP.length; i++) if (PREP[i].personId === personId && PREP[i].meetingDate === date) return PREP[i];
  return null;
}
function goalIsOptional(g) { return g.status === 'blocked'; }

// ---------- draft -------------------------------------------------------------

function draftKey() { return 'direct_prep_draft:' + STORE_NS + ':' + WHO.id + ':' + DATE; }
function saveDraft() { if (WHO && DATE && DRAFT) lsSet(draftKey(), JSON.stringify(DRAFT)); }

function blankDraft(p) {
  var d = { goals: {}, velocity: '', qgVelocity: '', happiness: '', fullWeek: '',
            pulseFocus: '', pulseDone: '', pulseGoal: '', win: '', noWin: false, parking: [], approved: false };
  p.goals.forEach(function (g) {
    d.goals[g.id] = { color: '', since: '', next: '', pct: '', confidence: '', blockers: '' };
  });
  return d;
}
function draftFromSubmission(p, s) {
  var d = blankDraft(p);
  (s.goals || []).forEach(function (g) {
    if (!d.goals[g.goalId]) return;
    d.goals[g.goalId] = { color: g.color || '', since: g.sinceLastSync || '', next: g.nextBeforeMeeting || '',
      pct: g.percentComplete == null ? '' : String(g.percentComplete),
      confidence: g.confidence == null ? '' : String(g.confidence), blockers: g.blockers || '' };
  });
  var lw = s.lastWeek || {};
  d.velocity = lw.velocity == null ? '' : String(lw.velocity);
  d.qgVelocity = lw.qgVelocity == null ? '' : String(lw.qgVelocity);
  d.happiness = lw.happiness == null ? '' : String(lw.happiness);
  d.fullWeek = lw.fullWeek == null ? '' : (lw.fullWeek ? 'full' : 'short');
  var hp = s.happinessPulse || {};
  d.pulseFocus = hp.focus || ''; d.pulseDone = hp.definitionOfDone || ''; d.pulseGoal = hp.fromGoalId || '';
  d.win = (s.win && s.win.text) || ''; d.noWin = !!(s.win && s.win.none);
  d.parking = (s.parking || []).slice();
  return d;
}
function loadDraft() {
  var saved = lsGet(draftKey());
  if (saved) {
    try {
      var keep = JSON.parse(saved), d = blankDraft(WHO);
      Object.keys(d).forEach(function (k) { if (k !== 'goals' && keep[k] !== undefined) d[k] = keep[k]; });
      Object.keys(d.goals).forEach(function (k) { if (keep.goals && keep.goals[k]) d.goals[k] = keep.goals[k]; });
      d.approved = false;
      return d;
    } catch (e) {}
  }
  var sub = submissionFor(WHO.id, DATE);
  return sub ? draftFromSubmission(WHO, sub) : blankDraft(WHO);
}

// ---------- validation ------------------------------------------------------

function validate() {
  var errs = {};
  WHO.goals.forEach(function (g) {
    if (goalIsOptional(g)) return;
    var a = DRAFT.goals[g.id], p = 'g' + g.id + '.';
    if (!a.color) errs[p + 'color'] = 'Choose a color.';
    if (!filled(a.since)) errs[p + 'since'] = 'Required.';
    if (!filled(a.next)) errs[p + 'next'] = 'Required.';
    var pct = Number(a.pct);
    if (a.pct === '' || isNaN(pct) || pct < 0 || pct > 100) errs[p + 'pct'] = 'Enter 0 to 100.';
    if (!a.confidence) errs[p + 'confidence'] = 'Choose a rating.';
    if (!filled(a.blockers)) errs[p + 'blockers'] = 'Required. Write "None" if nothing is blocking you.';
  });
  if (DRAFT.velocity === '' || isNaN(Number(DRAFT.velocity)) || Number(DRAFT.velocity) < 0) errs.velocity = 'Required. Zero is valid.';
  if (DRAFT.qgVelocity === '' || isNaN(Number(DRAFT.qgVelocity)) || Number(DRAFT.qgVelocity) < 0) errs.qgVelocity = 'Required. Zero is valid.';
  if (!DRAFT.happiness) errs.happiness = 'Choose your score.';
  if (!DRAFT.fullWeek) errs.fullWeek = 'Choose full or short week.';
  if (!filled(DRAFT.pulseFocus)) errs.pulseFocus = 'Required.';
  if (!filled(DRAFT.pulseDone)) errs.pulseDone = 'Required.';
  if (!DRAFT.noWin && !filled(DRAFT.win)) errs.win = 'Share a win, or check "No win to share".';
  if (!DRAFT.approved) errs.approved = 'Check the box to confirm you reviewed your answers.';
  return errs;
}

// ---------- render: shell -----------------------------------------------------

function renderTabs() {
  document.getElementById('tabs').innerHTML =
    '<button class="tab' + (VIEW === 'prep' ? ' on' : '') + '" data-view="prep">Prepare</button>' +
    '<button class="tab' + (VIEW === 'review' ? ' on' : '') + '" data-view="review">Review</button>';
}

function render() {
  renderTabs();
  var root = document.getElementById('root');
  root.innerHTML = VIEW === 'review' ? renderReview() : renderPrep();
}

function banners() {
  var h = '';
  if (!TOKEN && !LOCAL_MODE && VIEW === 'prep') {
    h += '<div class="banner warn">This link is read-only. Use the full link Mike sent you to submit.</div>';
  }
  if (MSG) h += '<div class="banner ' + (MSG.kind === 'ok' ? 'ok' : 'err') + '">' + esc(MSG.text) + '</div>';
  return h;
}

// ---------- render: prepare -----------------------------------------------------

function renderPrep() {
  var h = banners();
  h += '<div class="eyebrow">Come ready to talk</div><h1>A little prep. A better conversation.</h1>' +
       '<p class="lede">Share where things stand, what’s next, and what you need help with. ' +
       'Answer every question. Short answers and best estimates are fine. Write “None” when there’s nothing to add.</p>';

  h += '<div class="card"><h3>Meeting</h3>';
  h += '<label class="q" for="who">Who are you?</label><select id="who" data-f="who"><option value="">Choose your name</option>';
  DATA.directs.forEach(function (p) {
    h += '<option value="' + esc(p.id) + '"' + (WHO && WHO.id === p.id ? ' selected' : '') + '>' +
         esc(p.name) + ' · ' + esc(p.roleLabel) + ', ' + esc(p.branchName) + '</option>';
  });
  h += '</select>';
  h += '<label class="q" for="mdate">Meeting date</label><input type="date" id="mdate" data-f="date" value="' + esc(DATE) + '">';
  if (WHO) {
    h += '<p class="hint" style="margin-top:10px">With <b>Mike Vandenbroader</b>, with <b>' + esc(WHO.bmName) +
         '</b> in the room. Shared with Mike and your branch manager.</p>';
    var sub = submissionFor(WHO.id, DATE);
    h += '<p class="hint">' + (sub ? 'Submitted ' + esc(new Date(sub.submittedAt).toLocaleString()) + '. You can resubmit an update.'
                                    : 'No preparation submitted yet.') + '</p>';
  }
  h += '</div>';

  if (!WHO || !DATE) return h;
  var errs = SHOW_ERRORS ? validate() : {};
  function err(k) { return errs[k] ? '<div class="errtxt">' + esc(errs[k]) + '</div>' : ''; }
  function bad(k) { return errs[k] ? ' bad' : ''; }

  h += '<div class="sec-eyebrow">Your conversation</div><h2>1:1 · ' + esc(DATE) + '</h2>';
  h += '<div class="toc"><a href="#s1"><b>01</b>Your goals</a><a href="#s2"><b>02</b>Last week’s results</a>' +
       '<a href="#s3"><b>03</b>Your Happiness Pulse</a><a href="#s4"><b>04</b>Your win</a>' +
       '<a href="#s5"><b>05</b>Parking Lot</a><a href="#s6"><b>06</b>Review &amp; submit</a></div>';

  // 01 goals
  h += '<div class="section" id="s1"><h2>Your goals</h2><p class="hint">Review your current colors, then update what changed. ' +
       'Answer each question, using your best estimates for the numbers.</p>';
  WHO.goals.forEach(function (g, i) {
    var a = DRAFT.goals[g.id], p = 'g' + g.id + '.', opt = goalIsOptional(g);
    h += '<div class="goal"><div class="goal-head">';
    h += '<div class="goal-tag">Goal ' + String(i + 1).padStart(2, '0') + (opt ? ' · Blocked, optional' : '') + '</div>';
    h += '<h3 style="font-size:1.2rem;margin-top:4px">' + esc(g.name) + '</h3>';
    h += '<div class="tgt-l">Green target</div><div>' + esc(g.thresholds.green || '') + '</div>';
    if (g.thresholds.superGreen) h += '<details><summary>Super Green target</summary><p style="margin-top:6px">' + esc(g.thresholds.superGreen) + '</p></details>';
    if (g.thresholds.red) h += '<details><summary>Red</summary><p style="margin-top:6px">' + esc(g.thresholds.red) + '</p></details>';
    h += '<div class="src">Dashboard color: ' + pill(g.status) + (g.lastUpdated ? ' · Last source update: ' + esc(g.lastUpdated) + '.' : '') + '</div>';
    if (g.nextAction) h += '<div class="src">Your last committed next step: ' + esc(g.nextAction) + '</div>';
    h += '</div><div class="goal-body">';
    h += '<label class="q">Where does this goal stand?</label><p class="hint">Choose your current color against the targets above. Use Unknown if you can’t assess it yet.</p>';
    h += '<select data-g="' + g.id + '" data-k="color" class="' + bad(p + 'color') + '"><option value="">Choose a color</option>';
    COLORS.forEach(function (c) { h += '<option value="' + c[0] + '"' + (a.color === c[0] ? ' selected' : '') + '>' + c[1] + '</option>'; });
    h += '</select>' + err(p + 'color');
    h += '<label class="q">Since our last sync<span class="req">Required</span></label><p class="hint">What did you complete, and why is the goal this color? Include the result or progress made. If nothing moved, say so and explain why.</p>';
    h += '<textarea data-g="' + g.id + '" data-k="since" class="' + bad(p + 'since') + '">' + esc(a.since) + '</textarea>' + err(p + 'since');
    h += '<label class="q">What will you get done before our next meeting, and what actions will you take to accomplish it?<span class="req">Required</span></label>' +
         '<p class="hint">Be specific about what finished looks like and what you’ll do to get there. If the goal is complete or paused, name the next checkpoint.</p>';
    h += '<textarea data-g="' + g.id + '" data-k="next" placeholder="What’s your definition of done for this task?" class="' + bad(p + 'next') + '">' + esc(a.next) + '</textarea>' + err(p + 'next');
    h += '<label class="q">Your best estimates<span class="req">Both required</span></label><div class="row"><div>' +
         '<p class="hint">Percent complete 0–100%. For ongoing work, how much of this quarter’s target you’ve delivered.</p>' +
         '<input type="number" min="0" max="100" data-g="' + g.id + '" data-k="pct" value="' + esc(a.pct) + '" class="' + bad(p + 'pct') + '">' + err(p + 'pct') +
         '</div><div><p class="hint">Confidence 1–5 that you’ll meet the Green target by the deadline.</p>' +
         '<select data-g="' + g.id + '" data-k="confidence" class="' + bad(p + 'confidence') + '"><option value="">Choose a rating</option>';
    CONFIDENCE.forEach(function (c, ci) { h += '<option value="' + (ci + 1) + '"' + (String(a.confidence) === String(ci + 1) ? ' selected' : '') + '>' + c + '</option>'; });
    h += '</select>' + err(p + 'confidence') + '</div></div>';
    h += '<label class="q">What’s getting in your way?<span class="req">Required</span></label><p class="hint">Put each blocker on its own line. Write “None” if nothing is blocking you.</p>';
    h += '<textarea data-g="' + g.id + '" data-k="blockers" class="' + bad(p + 'blockers') + '">' + esc(a.blockers) + '</textarea>' + err(p + 'blockers');
    h += '</div></div>';
  });
  h += '</div>';

  // 02 last week
  h += '<div class="section" id="s2"><div class="sec-eyebrow">Looking back</div><h2>Last week’s results</h2>' +
       '<p class="hint">Enter your board totals before clearing Hold for Sync Up. Zero is a valid answer; blank means you haven’t answered yet.</p><div class="card">';
  h += '<div class="row"><div><label class="q">Overall velocity<span class="req">Required</span></label><p class="hint">Add the Weekly LOW values for all items in Hold for Sync Up on your Monday board.</p>' +
       '<input type="number" min="0" data-f="velocity" value="' + esc(DRAFT.velocity) + '" class="' + bad('velocity') + '">' + err('velocity') + '</div>' +
       '<div><label class="q">QG velocity<span class="req">Required</span></label><p class="hint">Add the QG Value column for items in Hold for Sync Up. Not a percent-complete estimate.</p>' +
       '<input type="number" min="0" data-f="qgVelocity" value="' + esc(DRAFT.qgVelocity) + '" class="' + bad('qgVelocity') + '">' + err('qgVelocity') + '</div></div>';
  h += '<label class="q">Happiness score<span class="req">Required · 1–5</span></label><p class="hint">How did the week feel? 1–2 = significant obstacles; 3 = obstacles limited your progress; 4–5 = a happy, productive week.</p>' +
       '<select data-f="happiness" class="' + bad('happiness') + '"><option value="">Choose your score</option>';
  HAPPY.forEach(function (c, ci) { h += '<option value="' + (ci + 1) + '"' + (String(DRAFT.happiness) === String(ci + 1) ? ' selected' : '') + '>' + c + '</option>'; });
  h += '</select>' + err('happiness');
  h += '<label class="q">Was this a full workweek?</label><p class="hint">Short weeks keep their scores in history but are excluded from velocity averages.</p>' +
       '<select data-f="fullWeek" class="' + bad('fullWeek') + '"><option value="">Choose full or short week</option>' +
       '<option value="full"' + (DRAFT.fullWeek === 'full' ? ' selected' : '') + '>Full workweek</option>' +
       '<option value="short"' + (DRAFT.fullWeek === 'short' ? ' selected' : '') + '>Short week — exclude velocity from averages</option></select>' + err('fullWeek');
  h += '</div></div>';

  // 03 happiness pulse
  h += '<div class="section" id="s3"><div class="sec-eyebrow">This week</div><h2>Your Happiness Pulse</h2>' +
       '<p class="hint">Choose one outcome that matters to you this week. It can connect to a goal above. Both answers are required.</p><div class="card">';
  h += '<label class="q">Use a rock commitment (optional)</label><select data-f="pulseGoal"><option value="">Write my own answer</option>';
  WHO.goals.forEach(function (g) { h += '<option value="' + g.id + '"' + (String(DRAFT.pulseGoal) === String(g.id) ? ' selected' : '') + '>' + esc(g.name) + '</option>'; });
  h += '</select><p class="hint" style="margin-top:4px">Copies that goal’s “before our next meeting” answer below. You can edit it.</p>';
  h += '<label class="q">What’s the one thing you want to move that would make you happy this week?</label>' +
       '<textarea data-f="pulseFocus" class="' + bad('pulseFocus') + '">' + esc(DRAFT.pulseFocus) + '</textarea>' + err('pulseFocus');
  h += '<label class="q">How will we know it’s done? — Definition of done</label><p class="hint">Make the finish line concrete and easy to recognize.</p>' +
       '<textarea data-f="pulseDone" class="' + bad('pulseDone') + '">' + esc(DRAFT.pulseDone) + '</textarea>' + err('pulseDone');
  h += '</div></div>';

  // 04 win
  h += '<div class="section" id="s4"><div class="sec-eyebrow">Worth sharing</div><h2>Your win this week</h2><div class="card">' +
       '<label class="q">What went well since our last meeting?</label><p class="hint">Something that went well or someone worth recognizing.</p>' +
       '<textarea data-f="win"' + (DRAFT.noWin ? ' disabled' : '') + ' class="' + bad('win') + '">' + esc(DRAFT.win) + '</textarea>' + err('win') +
       '<div class="check"><input type="checkbox" id="nowin" data-f="noWin"' + (DRAFT.noWin ? ' checked' : '') + '><label for="nowin">No win to share</label></div>' +
       '</div></div>';

  // 05 parking
  h += '<div class="section" id="s5"><div class="sec-eyebrow">Make time for it</div><h2>Parking Lot for your 1:1</h2><div class="card">' +
       '<p class="hint">Anything you want to talk through? Bring a question, decision, or concern so it doesn’t get missed.</p>';
  DRAFT.parking.forEach(function (item, i) {
    h += '<div class="park"><input type="text" data-park="' + i + '" value="' + esc(item) + '"><button class="x" data-unpark="' + i + '" aria-label="Remove">Remove</button></div>';
  });
  h += '<div class="btns"><button class="btn ghost" data-act="addpark">Add parking item</button></div></div></div>';

  // 06 submit
  h += '<div class="section" id="s6"><div class="sec-eyebrow">Ready for the conversation</div><h2>Review &amp; submit</h2><div class="card">' +
       '<p class="hint">Your definitions of done are proposals to agree on together in the meeting. Check that every question has an answer before submitting.</p>' +
       '<div class="check"><input type="checkbox" id="appr" data-f="approved"' + (DRAFT.approved ? ' checked' : '') + '>' +
       '<label for="appr">I reviewed these answers and approve submitting them for this meeting.</label></div>' + err('approved');
  if (SHOW_ERRORS && Object.keys(errs).length) h += '<div class="errtxt" style="margin-top:10px">' + Object.keys(errs).length + ' answer(s) still need attention above.</div>';
  h += '<div class="btns"><button class="btn" data-act="submit"' + (BUSY ? ' disabled' : '') + '>' + (BUSY ? 'Submitting...' : 'Submit preparation') + '</button>' +
       '<button class="btn ghost" data-act="copy">Copy draft</button></div>' +
       '<p class="hint" style="margin-top:10px">Your work is sent when you submit. You can resubmit an update before the meeting.</p></div></div>';
  return h;
}

// ---------- render: review (Mike, with the BM in the room) -----------------------------

function renderReview() {
  var h = banners();
  h += '<div class="eyebrow">BM 1:1 review</div><h1>Are the directs making progress?</h1>' +
       '<p class="lede">Each direct’s latest preparation, grouped by branch, with their color next to the dashboard color. Walk it with the BM in the room.</p>';
  var branches = [];
  DATA.directs.forEach(function (p) { if (branches.indexOf(p.branch) < 0) branches.push(p.branch); });
  h += '<div class="card"><label class="q" for="rvb">Branch</label><select id="rvb" data-f="reviewBranch"><option value="">All branches</option>';
  branches.forEach(function (b) {
    var p = DATA.directs.filter(function (x) { return x.branch === b; })[0];
    h += '<option value="' + esc(b) + '"' + (REVIEW_BRANCH === b ? ' selected' : '') + '>' + esc(p.branchName) + ' · BM ' + esc(p.bmName) + '</option>';
  });
  h += '</select></div>';

  DATA.directs.filter(function (p) { return !REVIEW_BRANCH || p.branch === REVIEW_BRANCH; }).forEach(function (p) {
    var subs = PREP.filter(function (s) { return s.personId === p.id; })
                   .sort(function (a, b) { return b.meetingDate.localeCompare(a.meetingDate); });
    var s = subs[0];
    h += '<div class="card"><h3>' + esc(p.name) + ' <span class="muted" style="font-weight:400">· ' + esc(p.roleLabel) + ', ' + esc(p.branchName) + '</span></h3>';
    if (!s) { h += '<p class="muted">No preparation submitted yet.</p></div>'; return; }
    var lw = s.lastWeek || {};
    h += '<p class="hint">Meeting ' + esc(s.meetingDate) + ' · submitted ' + esc(new Date(s.submittedAt).toLocaleString()) +
         (subs.length > 1 ? ' · ' + (subs.length - 1) + ' earlier' : '') + '</p>';
    h += '<p style="font-size:14px">Velocity <b>' + esc(lw.velocity) + '</b> · QG velocity <b>' + esc(lw.qgVelocity) +
         '</b> · Happiness <b>' + esc(lw.happiness) + '/5</b>' + (lw.fullWeek === false ? ' · short week' : '') + '</p>';
    (s.goals || []).forEach(function (g) {
      var mismatch = g.color && g.sourceStatus && g.color !== g.sourceStatus && !(g.color === 'yellow' && g.sourceStatus === 'at_risk');
      h += '<div class="rv-goal"><b>' + esc(g.goalName) + '</b><br>Says ' + pill(g.color) + ' · dashboard ' + pill(g.sourceStatus) +
           (mismatch ? ' <span class="flag">color moved</span>' : '') +
           ' · ' + esc(g.percentComplete) + '% · confidence ' + esc(g.confidence) + '/5';
      h += '<p><b>Since last sync:</b> ' + esc(g.sinceLastSync) + '</p><p><b>Before next meeting:</b> ' + esc(g.nextBeforeMeeting) + '</p>';
      if (g.blockers && !/^none\.?$/i.test(g.blockers.trim())) h += '<p><b>Blockers:</b> ' + esc(g.blockers) + '</p>';
      h += '</div>';
    });
    var hp = s.happinessPulse || {};
    h += '<p style="margin-top:12px;font-size:14px"><b>Happiness Pulse:</b> ' + esc(hp.focus) + ' <span class="muted">— done when: ' + esc(hp.definitionOfDone) + '</span></p>';
    h += '<p style="font-size:14px"><b>Win:</b> ' + (s.win && s.win.none ? '<span class="muted">No win this week</span>' : esc(s.win && s.win.text)) + '</p>';
    if ((s.parking || []).length) h += '<p style="font-size:14px"><b>Parking Lot:</b> ' + s.parking.map(esc).join(' · ') + '</p>';
    h += '</div>';
  });
  return h;
}

// ---------- submit + copy ----------------------------------------------------------

function buildEntry() {
  return {
    personId: WHO.id, personName: WHO.name, role: WHO.role, branch: WHO.branch,
    meetingDate: DATE, meetingType: '1:1', facilitator: 'Mike Vandenbroader', inRoom: WHO.bmName,
    submittedAt: new Date().toISOString(),
    goals: WHO.goals.map(function (g) {
      var a = DRAFT.goals[g.id];
      return { goalId: g.id, goalName: g.name, sourceStatus: g.status, color: a.color || null,
        sinceLastSync: a.since.trim(), nextBeforeMeeting: a.next.trim(),
        percentComplete: a.pct === '' ? null : Number(a.pct), confidence: a.confidence === '' ? null : Number(a.confidence),
        blockers: a.blockers.trim(), optional: goalIsOptional(g) };
    }),
    lastWeek: { velocity: Number(DRAFT.velocity), qgVelocity: Number(DRAFT.qgVelocity),
                happiness: Number(DRAFT.happiness), fullWeek: DRAFT.fullWeek === 'full' },
    happinessPulse: { focus: DRAFT.pulseFocus.trim(), definitionOfDone: DRAFT.pulseDone.trim(),
                      fromGoalId: DRAFT.pulseGoal === '' ? null : Number(DRAFT.pulseGoal) },
    win: { text: DRAFT.noWin ? '' : DRAFT.win.trim(), none: !!DRAFT.noWin },
    parking: DRAFT.parking.map(function (x) { return x.trim(); }).filter(function (x) { return x; })
  };
}

function submitPrep() {
  SHOW_ERRORS = true; MSG = null;
  if (Object.keys(validate()).length) { render(); document.getElementById('s6').scrollIntoView(); return; }
  if (!TOKEN && !LOCAL_MODE) { MSG = { kind: 'bad', text: 'This link is read-only. Use the full link Mike sent you.' }; render(); return; }
  if (LOCAL_MODE) {
    var e = buildEntry();
    PREP = PREP.filter(function (s) { return !(s.personId === e.personId && s.meetingDate === e.meetingDate); }).concat([e]);
    MSG = { kind: 'ok', text: 'Local test: preparation built but not sent (localhost).' };
    render(); window.scrollTo(0, 0); return;
  }
  BUSY = true; render();
  savePrep(buildEntry()).then(function () {
    BUSY = false; SHOW_ERRORS = false; lsDel(draftKey());
    DRAFT = draftFromSubmission(WHO, submissionFor(WHO.id, DATE));
    MSG = { kind: 'ok', text: 'Submitted. Mike will review it with ' + WHO.bmName + ' in their 1:1.' };
    render(); window.scrollTo(0, 0);
  }).catch(function (err) {
    BUSY = false; MSG = { kind: 'bad', text: err.message }; render(); window.scrollTo(0, 0);
  });
}

function copyDraft() {
  var e = buildEntry(), t = e.personName + ' — 1:1 prep for ' + e.meetingDate + '\n\n';
  e.goals.forEach(function (g) {
    t += g.goalName + ' [' + (COLOR_LABEL[g.color] || '?') + ', ' + (g.percentComplete == null ? '?' : g.percentComplete) + '%, confidence ' + (g.confidence || '?') + '/5]\n' +
         '  Since last sync: ' + g.sinceLastSync + '\n  Before next meeting: ' + g.nextBeforeMeeting + '\n  Blockers: ' + g.blockers + '\n\n';
  });
  t += 'Velocity ' + DRAFT.velocity + ' / QG velocity ' + DRAFT.qgVelocity + ' / Happiness ' + DRAFT.happiness + '/5\n';
  t += 'Happiness Pulse: ' + e.happinessPulse.focus + ' (done when: ' + e.happinessPulse.definitionOfDone + ')\n';
  t += 'Win: ' + (e.win.none ? 'No win this week' : e.win.text) + '\n';
  if (e.parking.length) t += 'Parking Lot: ' + e.parking.join('; ') + '\n';
  var done = function () { MSG = { kind: 'ok', text: 'Draft copied.' }; render(); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { MSG = { kind: 'bad', text: 'Copy failed.' }; render(); });
}

// ---------- events -----------------------------------------------------------

function selectWho(id) {
  WHO = personById(id); MSG = null; SHOW_ERRORS = false;
  if (WHO) { lsSet('direct_prep_who_' + STORE_NS, WHO.id); DRAFT = loadDraft(); } else DRAFT = null;
  render();
}
function setDate(v) {
  DATE = v; MSG = null; SHOW_ERRORS = false;
  if (WHO && DATE) DRAFT = loadDraft();
  render();
}

document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t.dataset.view) { VIEW = t.dataset.view; MSG = null; render(); return; }
  if (t.dataset.act === 'addpark') { DRAFT.parking.push(''); saveDraft(); render(); return; }
  if (t.dataset.unpark !== undefined) { DRAFT.parking.splice(Number(t.dataset.unpark), 1); saveDraft(); render(); return; }
  if (t.dataset.act === 'submit') { submitPrep(); return; }
  if (t.dataset.act === 'copy') { copyDraft(); return; }
});

// Text input updates state without re-rendering (keeps focus); selects/checkboxes re-render.
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (!DRAFT) return;
  if (t.dataset.g && t.tagName !== 'SELECT') { DRAFT.goals[t.dataset.g][t.dataset.k] = t.value; saveDraft(); return; }
  if (t.dataset.park !== undefined) { DRAFT.parking[Number(t.dataset.park)] = t.value; saveDraft(); return; }
  if (t.dataset.f && t.tagName !== 'SELECT' && t.type !== 'checkbox' && t.type !== 'date') { DRAFT[t.dataset.f] = t.value; saveDraft(); }
});

document.addEventListener('change', function (ev) {
  var t = ev.target, f = t.dataset.f;
  if (f === 'who') { selectWho(t.value); return; }
  if (f === 'date') { setDate(t.value); return; }
  if (f === 'reviewBranch') { REVIEW_BRANCH = t.value; render(); return; }
  if (!DRAFT) return;
  if (t.dataset.g && t.tagName === 'SELECT') { DRAFT.goals[t.dataset.g][t.dataset.k] = t.value; saveDraft(); render(); return; }
  if (f === 'pulseGoal') {
    DRAFT.pulseGoal = t.value;
    if (t.value && DRAFT.goals[t.value]) DRAFT.pulseFocus = DRAFT.goals[t.value].next;
    saveDraft(); render(); return;
  }
  if (t.type === 'checkbox') { DRAFT[f] = t.checked; saveDraft(); render(); return; }
  if (f && t.tagName === 'SELECT') { DRAFT[f] = t.value; saveDraft(); render(); }
});

// ---------- boot -------------------------------------------------------------

function boot() {
  resolveToken();
  if (/[#&]view=review/.test(location.hash)) VIEW = 'review';
  DATE = todayIso();
  Promise.all([readFile('data/direct-goals.json'), readFile(PREP_PATH).catch(function () { return { text: '{"submissions":[]}' }; })])
    .then(function (r) {
      DATA = JSON.parse(r[0].text);
      PREP = (JSON.parse(r[1].text).submissions) || [];
      var last = lsGet('direct_prep_who_' + STORE_NS);
      if (last && personById(last)) { WHO = personById(last); DRAFT = loadDraft(); }
      render();
    })
    .catch(function (err) {
      document.getElementById('root').innerHTML = '<div class="banner err">Could not load your goals: ' + esc(err.message) + '</div>';
    });
}
boot();
</script>
</body>
</html>
